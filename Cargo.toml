[package]
name = "rust-common-deps"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"                  # MSRV
description = "Rust common dependencies"

[package.metadata.vendor-filter]
platforms = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[dependencies]
backon = "1.6.0"       # 重试，但似乎并无必要
governor = "0.10.4"    # 基于 GCRA 的in-process 限流
open-feature = "0.3.0" # 
moka = { version = "0.12.16", features = ["future"] }   # 缓存
minijinja = { version = "2.24.0", features = [
    "json",
    "loader",
    "loop_controls",
] } # 模板引擎
nom = "8.0.0" # parser combinator，解析器组合器，使用最多
notify = "8.2.0"
# deadpool = { version = "0.13.1" } # 池管理，更适合数据库这种长期正常的连接
# 嵌入式搅拌方案，js比lua更适用，虽然方案不如mlua成熟
rquickjs ={ version = "0.14.0", features = ["macro", "indexmap"]}

# utils/lang
delegate = "0.13.5"                                   # 通过宏实现方法委托
strum = { version = "0.28.0", features = ["derive"] } # Enum 属性、方法扩展
derive_more = { version = "2", features = ["full"] }  # 宏，简化常用 trait 派生，尤其适合在 newtype pattern
bon = "3.10.1"                                         # Builder Pattern 宏，支持函数参数的builder，很好用，但还不支持嵌套
enum_dispatch = "0.3.13"                              # 相当于 Sealed Trait 的静态派发，但少用（少用宏、少用依赖）
displaydoc = "0.2.7"                                  # 注释作为 Display
indoc = "2.0.7"                                       # 宏，生成字符串去除前面的缩进
dyn-clone = "1.0.20"                                  # trait object 的 clone
static_assertions = "1.1.0"

# utils/macro
syn = "3.0.6"
quote = "1.0"
proc-macro2 = "1.0"

# std
regex = "1.13.1"  # 正则正则表达式，不支持回溯
base64 = "0.23.1" # Base64 编码/解码
hex = "0.4.3"     # Hex 编码/解码
bytes = "1"       # 可复用的bytes，减少内存拷贝
bitflags = "2.13.2"

# std/collections
either = "1.18.0"
itertools = "0.15.0"
indexmap = "2.14.2" # 有序 map/set
arrayvec = { version = "0.7.8" , features = ["serde"] } # 固定容量的 Vec，放在栈上，适合限制最大容量的场景
smallvec = { version = ">=1.15.0", features = ["serde"] } # 小容量优化的 Vec, 小于指定容量时放在栈上，超过时放在堆上，适合多数时候小数组、偶尔大数组的场景
bimap = { version = "0.6.3", features = ["serde"] }     # 双向 map ，维护状态不佳，但没更好选择

# std/concurrent
rayon = "1.12"
arc-swap = "1.9.2"
dashmap = { version = "6.2.1", features = ["serde"] } # 并发 Map
parking_lot = "0.12.5" # 锁相关同步原语，替代标准化，占用更小、性能更好，没有锁中毒

# std/async
futures = "0.3.34"
async-trait = "0.1.92"
trait-variant = "0.1.3"
tokio = { version = "1.53.1", features = ["full"] }
tokio-stream = "0.1.19"
async-stream = "0.3"

# std/os
rand = "0.10.3"    # 随机生成，API变动大，等待 1.0
fastrand = "2.5.0" # 轻量级随机生成，性能更好，API稳定，适合非密码学场景
walkdir = "2.5.0"  # 递归遍历目录
tempfile = "3.27"  # 临时文件、内存文件
which = "8.0.6"    # 类似 which 命令
glob = "0.3.4"     # glob 模式匹配, 来自 rust 官方
globset = "0.4.20" # 支持一组glob，来自 ripgrep
hostname = "0.4.2" # 获取主机名，零依赖
chrono = { version = "0.4.45", default-features = false, features = [
    "serde",
    "std",
    "clock",
] }                # 最旧但也最广泛的一个日期库，择机替换为 jiff （sqlx支持后）
jiff = "0.2.37"    # 现代日期库，替代 chrono

# std/num
num-traits = "0.2.19"
rust_decimal = { version = "1.43.0", features = ["macros"] }

# std/error
anyhow = "1.0.104"
thiserror = "2.0.21"

# std/log-trace-metric
log = "0.4.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = [
    "env-filter",
    "chrono",
    "json",
] }
tracing-appender = "0.2.5"
tracing-error = "0.2.1"
# prometheus = "0.14.0"
opentelemetry = "0.33.0"                          # OTel 公共依赖
opentelemetry_sdk = "0.33.0"                      # OTel SDK: Tracing/Log/Metrics
opentelemetry-semantic-conventions = "0.33.0"     # OTel 语义约定
opentelemetry-stdout = "0.33.0"                   # OTel 直接输出到 stdout，测试使用
opentelemetry-otlp = {version = "0.33.0", features = ["grpc-tonic"]} # OTel OTLP Exporter 实现，对接标准的 OpenTelemetry Collector，支持 gRPC、HTTP/JSON、HTTP/Protobuf

opentelemetry-resource-detectors = "0.13.0"       # OTel Os、Proc、Container 环境的资源识别
opentelemetry-instrumentation-tower = "0.19.0"    # 集成 tower

opentelemetry-appender-tracing = "0.33.0"                               # OTel 与 tracing 集成，把 tracing的event转换为OTel的LogRecords
tracing-opentelemetry = { version = "0.34.0", features = ["metrics"]  } # OTel 与 tracing 集成，把 tracing的span转换为OTel的Span

# std/zip
flate2 = "1.1.10"  # 来自Rust官方，支持gzip、deflate、zip，有多个后端，默认是rust实现
tar = "0.4.46"    # rust 实现
zstd = "0.14.0"   # rust 实现

# std/build
shadow-rs = { version = "2.0.0", default-features = false } # 构建时信息，默认依赖git、time
# git2 = { version = "0.19.0", features = ["vendored-libgit2", "vendored-openssl"] }
rust-embed = { version = "8.12.0", features = [
    "include-exclude",
    "interpolate-folder-path",
    "mime_guess",
] } # 嵌入文件

# data
serde = { version = "1.0", features = ["derive"] }
serde_with = { version = "3.23.0", features = ["json"] }
serde_repr = "0.1.21"                                    # C-like 枚举的序列化，对于以数字表示的api好用
serde_path_to_error = "0.1.20"                            # serde 路径错误定位
# data/json
serde_json = "1.0"
json-patch = "4.2.0"
# jmespath = "0.5.0" # 查询比jsonpath更擅长，但是转换json的又远不如 jq(jaq)/Jsonnet/Starlark/KCL/nickel

yaml_serde = "0.10.7" # 原作者早就不再维护，目前是yaml官方接手维护
quick-xml = { version = "0.42.0", features = ["encoding", "serialize"] }
csv = "1.4.0"
toml = { version = "1.1.6", features = ["preserve_order"] }
toml_edit = "0.25.15"
schemars = "1.2.2"                                        # 生成 JSON Schema
validator = { version = "0.21.0", features = ["derive"] }
# data-type
uuid = { version = "1.26.1", features = [
    "v4",                # 随机 UUID
    "v7",                # 随时间递增 UUID
    "macro-diagnostics",
    "fast-rng",
    "serde",
] }

# data-excel
umya-spreadsheet = "3.1.0" # 支持读写 xlsx/xlsm，不是很成熟，但没其他选择了
calamine = { version = "0.36.1", features = ["dates"] }
rust_xlsxwriter = { version = "0.99.1", features = [
    "chrono",
    "serde",
    # "polars",
] }
# 问题是这是一个大型的C++依赖，不好静态编译到musl
# duckdb = { version = "1.10503.1", features = ["chrono", "bundled", "vtab-excel", "parquet"] }
parquet = { version = "60.0.0", features = ["async", "json"]}
# 暂不使用，Rust版本的API不稳定，且 MRSV 要求过高
polars = { version = "0.55.2", features = [
    "lazy",
    # "sql", # 太重
    "random",
    "timezones",
    "strings",
    # data types
    "dtype-categorical",
    "dtype-struct",
    "dtype-array",
    "dtype-decimal",
    # IO
    "json",           # JSON 序列化/反序列化
    "parquet",
    "serde",
    "serde-lazy",
    # DataFrame operations
    "asof_join",
    "cross_join",
    "partition_by",
    "rows", # pivot and transpose
    # Series/Expr operations
    "abs",
    "arg_where",
    "cum_agg",
    "diff",
    "find_many",
    "is_in",
    "is_between",
    "list_to_struct",
    "list_sets",
    "list_count",
    "log",
    "offset_by",
    "pct_change",
    "range",
    "rolling_window",
    "round_series",
    "unique_counts",
] }
# polars-json = "0.52.0"

# http
http = "1.5.0"
http-body = "1.1.0"  # HTTP Body 异步stream
http-body-util = "0.1.5"
url = "2.5.8" # URL 解析
serde_qs = "1.1.3" # 支持深层嵌套的 serde_urlencoded，兼容前端qs库格式 (serde_qs > serde_html_form > serde_urlencoded)
uri-template = { version = "0.1.0", features = ["macros"] }
percent-encoding = "2.3.2" # 百分号编码/解码
mime_guess = "2.0.5"
# 最流行的 HTTP 客户端库，但是缺少中间件机制
reqwest = { version = "0.13.5", features = [
    "blocking",  # 同步 API
    "cookies",
    "json",
    "multipart",
    "gzip",      # 保留 gzip，不要 deflate
    "zstd",      # 保留 zstd
    "socks",     # socks 代理
    "stream",
    # default
] }
# reqwest-middleware = "0.5.0"
# reqwest-retry = "0.9.0"
# reqwest-tracing = "0.6.0"
tokio-tungstenite = {version = "0.30.0", features = ["rustls-tls-webpki-roots"]}

# HTTP: LB
# pingora = { version = "0.6.0", features = ["proxy", "time", "lb", "proxy"]}

# database
sqlx = { version = "0.9.0", features = [
    "runtime-tokio",
    "sqlite",
    "mysql",
    "postgres",
    "any",
    "migrate",
    "macros",
    "derive",
    "chrono",
    "uuid",
    "json",
    "rust_decimal",
] }
jiff-sqlx = "0.2.0" # jiff 的 SQLx 适配器，提供 jiff::DateTime 与 SQLx 的互操作性
# toasty = { version = "0.7.0", features = ["jiff","sqlite", "mysql", "postgresql"] } # 仍不成熟，查询、迁移功能缺失
# turso = "0.6.1" # SQLite 兼容性还是不行，观察
redis = { version = "1.7.1", features = [
    "tokio-rustls-comp",
    "cluster-async",
    "connection-manager",
    "uuid",
] } # 官方、稳定1.0

# cli
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
clap_complete = "4.6.11" # clap: 补全
colorchoice-clap = "1.0.8" # clap: 颜色全局控制参数，常见库中颜色输出均可统一控制，其实修改的是colorchoice库中的约定
clap-verbosity-flag = { version = "3.0.4", features = [
    "tracing",
] } # clap: `-vvv`，包括对日志输出级别的控制
clio = { version = "0.3.5", features = ["clap-parse"] } # clap: 统一文件参数，包括 `-`
owo-colors = { version = "4.4.0", features = ["supports-colors"] } # 彩色输出
tabled = { version = "0.22.0", features = ["ansi"] } # 打印表格样式
indicatif = "0.18.6" # 进度条
dialoguer = "0.12.0" # prompt，console/indicatif 的姊妹库，但风格并不喜欢
# cliclack = "0.3.6" # prompt，不额外引入依赖了，还是用 dialoguer
console = "0.16.6" # 与终端交互
figment = { version = "0.10", features = [
    "env",
    "toml",
] } # 配置管理，config-rs 维护状态不佳
dotenvy = "0.15" # .env 文件支持
dirs = "7.0.0"   # XDG 目录标准
notify-rust = "4.18.0" # 桌面通知
# cli-gui
open = "5.4.4" # 打开URI（轻量，无系统依赖）
arboard = "3.6.1" # 剪贴板
rfd = { version = "0.17.2", default-features = false, features = [
    "xdg-portal",
] } # 文件选择窗口，默认依赖Wayland系统库以静态链接，使用
wayland-backend = { version = "*", features = ["dlopen"] }

# TUI
ratatui = "0.30.2"   # TUI
crossterm = "0.29.0" # ratatui 的后端

# web
# 缺失诸多功能，尤其是OpenAPI这类易用性和框架高耦合的，但没办法
# salvo 集成太多且很多集成过于简陋; 不够成熟
# actix-web 宏、和Tokio异步生态不是很融合
# warp 和axum定位冲突了
# rocket 宏、维护状态不佳
axum = { version = "0.8.9", features = ["multipart", "ws"] }
axum-extra = { version = "0.12.6", features = [
    "attachment",
    "cookie",
    "error-response",
    "form",
    "json-lines",
    "json-deserializer",
    "multipart",
    "query",
    "typed-routing",
    "typed-header",
] }
axum_typed_multipart = "0.16.7"
axum-valid = "0.25.0"
tower = { version = "0.5", features = ["full"] }
tower-http = { version = "0.7.1", features = ["full"] }
# axum-login = "0.17"
# tower-sessions = "0.14"
# tower-sessions-redis-store = "0.16"
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
listenfd = "1.0.2"
tokio-cron-scheduler = { version = "0.15.1", features = [
    "signal",
] } # 定时/后台任务，考虑替换为 apalis ，但后者有些重了，不如自己写，或者更稳重的temporal或restate
# 添加swagger支持，但 utoipa 结合axum既麻烦又问题多，维护状态也不佳
utoipa = { version = "6.0.0", features = [
    "config",
    "axum_extras",
    "chrono",
    "uuid",
    "url",
] }
utoipa-axum = "0.3.0"
# utoipa-scalar = { version = "0.1.0", features = ["axum"] } # 无法 vendor
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
slug = "0.1.6"  # slugify a string
# durable execution engine
# 暂不考虑引入额外的中间件,
# * bullmq 很不错，还有第三方的UI,是celery作业队列很好的替代,但相比DE还是缺失了太多
# * dbos 不支持Rust
# * pgmq pg扩展有运维要求
# * 自己实现(listen/notify, select for update skip locked)
# 都是可考虑项
# restate 很吸引人，但是前景不明
# * 重试策略
# * 工作流持久化运行
# * 幂等，防止重复执行
# * 可观测行
# * 分布式状态
# 也有些小问题
# * sdk不支持 context propagation https://github.com/restatedev/sdk-rust/issues/64
# * 缺少内置支持的 cron https://github.com/restatedev/restate/issues/12
restate-sdk = { version = "0.12.1", features = ["reqwest-client"] }
croner = { version = "4.0.0", features = ["serde"] }

# resonate-sdk = "0.6.0"
# apalis = { version = "1.0.0-rc.9" , features = [
#     "retry",
#     "timeout",
#     "limit",
#     "filter",
#     "catch-panic",
# ]}
# apalis-cron = "1.0.0-rc.8"
# apalis-postgres = "1.0.0-rc.8"
# apalis-workflow = "0.1.0-rc.9"
# apalis-board = { version = "1.0.0-rc.8", features = ["axum", "ui", "web"] } # 体积太大
ldap3 = { version = "0.12.1", default-features = false, features = [
    "tls-rustls-aws-lc-rs"
] } # LDAP 客户端

# grpc
tonic = "0.14.6"
prost = "0.14.4"
tonic-prost = "0.14.6"
kube = { version = "4.2.0", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.28.0", features = ["latest", "schemars"] }

# network
ipnet = { version = "2.12.2", features = ["serde"] } # IP网络集合表示
prefix-trie = "0.10.1" # 针对IP的前缀树，支持 IPv4/IPv6以及二者的混合
mac_address = "1.1.8"

# OS
sysinfo = "0.39.6"
# unix
# nix = "0.31.1"
rustix = "1.1.5"

# cloud-native
opendal = { version = "0.59.3", features = [
    "services-fs",
    "services-http", # 只读，但也很好用了
    "services-s3",
    "services-obs",  # 华为 OBS
    # "services-sftp", #目前依赖openssh，不使用
] }

# crypto
# crypto/hash
md-5 = "0.11.0"  # md5，遗留，使用太多
sha1 = "0.11.0"  # sha1系列，遗留，偶尔
sha2 = "0.11.0"  # sha2 系列
# blake3 = "1.8.5" # 比 sha3 更具竞争力
# MAC
hmac = "0.13.0" # Hash-MAC
# crypto/Symmetric encryption
aes-gcm = "0.11.1"  # AES GCM 模式，更安全、更现代
ctr = "0.10.1"      # AES CTR 模式，遗留，使用太多
cbc = "0.2.1"       # AES CBC 模式，遗留，使用太多
cfb-mode = "0.9.1"  # AES CFB 模式，遗留，使用太多(SNMP)
# blowfish = "0.10.0" # Blowfish 加密算法，遗留
# crypto/password
password-auth = "1.0.0"
argon2 = "0.6.0"                                         # KDF 算法
secrecy = { version = "0.10.3", features = ["serde"] } # 和密码无关，只是用于安全包裹敏感数据

# string
strsim = "0.11.1" # 字符串相似度，可用于告警相似度
similar = "3.2.0" # 序列和文本diff算法

# infra
mimalloc = "0.1.52"                                  # 内存分配器，性能更好，尤其要替换musl的默认内存分配器
ring = { version = "*" }                             # 目前作者将该库仍定位于实验品，不要直接依赖
rustls = { version = "*" }
# infra/openssl 尽量保证不依赖
# openssl = { version = "*", features = ["vendored"] }

# top

# domain/ops
# FIX: 强制依赖ring，已提PR允许aws-lc-rs https://github.com/Miyoshi-Ryota/async-ssh2-tokio/pull/116
async-ssh2-tokio = "0.13.0"                            # SSH 客户端，依赖 russh
expectrl = { version = "0.9.0", features = ["async"] } # 小型库，暂时用不到
shlex = "2.0.1"                                        # shell 字符串转义
strip-ansi-escapes = "0.2.1"                           # shell ansi控制字符剥离
ansi-to-html = "0.2.4"                                 # shell ansi控制字符转html

# domain/snmp # SNMP v3 安全认证部分完整实现过于复杂
snmp2 = { version = "0.5.2", features = ["full"] }
mib-rs = "0.10.0"

# domain/ai-ml-llm
agent-client-protocol = "2.2.0" # ACP 的服务端/客户端协议实现
rmcp = { version = "3.4.1", features = ["server"] } # MCP 的服务端/客户端协议实现

# domain-spider
# scraper = "0.23"      # HTML/CSS 解析查询
# thirtyfour = "0.35"   # Web Driver
# playwright-rs = "0.9" #
# chromiumoxide = { version = "0.9.1" } # CDP API

# domain-email
lettre = { version = "0.11.23", default-features = false, features = [
    "tokio1",
    "builder",
    "hostname",
    "pool",
    "smtp-transport",
] }
email_address = "0.2.9"

# domain/doc
pulldown-cmark = "0.13.4"
printpdf = "0.12.8"        # 比lopdf、pdf-writer更高层次的PDF生成库
# 缺失docx生成

# domain/ebpf
# aya = "0.13.1"

[dev-dependencies]
test-log = { version = "0.2.21", features = ["trace"] } # 测试时捕获log输出
proptest = "1.11.0"                                      # 属性测试
sqlx-cli = { version = "0.9.0", features = ["postgres", "sqlite", "mysql", "completions", "sqlx-toml"] }
# rustlings = "6.4"
# systemfd = "0.4"
# watchexec-cli
# evcxr_repl = "0.19.0" # REPL
# cargo-typify = "0.5.0"
# bpf-linker

[build-dependencies]
shadow-rs = "*"
